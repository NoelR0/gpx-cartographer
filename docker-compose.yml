services:
  gpx-cartographer:
    build: .
    # Sobald ein Release veröffentlicht ist, stattdessen das fertige Image nehmen.
    # ":0.1" bekommt alle Bugfixes von v0.1.x, aber keine neuen Minor-Versionen.
    # image: ghcr.io/noelr0/gpx-cartographer:0.1
    container_name: gpx-cartographer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Zeitzone der Handy-Kamera, falls Fotos keinen EXIF-Zeitzonen-Offset haben
      CAMERA_TZ: Europe/Zurich
      # Fotos ohne GPS über die Zeitstempel der GPX-Tracks verorten
      MATCH_PHOTOS_TO_TRACKS: "true"
      MATCH_MAX_GAP: "300"
    volumes:
      # Linke Seite: deine Ordner auf dem Server
      - /path/to/photos:/data/photos:ro
      - /path/to/gpx:/data/gpx:ro
    # Läuft standardmässig als "nobody" (65534). Falls die Dateien nicht lesbar
    # sind, UID:GID des Syncthing-Benutzers eintragen:
    # user: "1000:1000"
