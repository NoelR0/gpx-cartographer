services:
  cartographer:
    build: .
    # Sobald das Image auf GitHub veröffentlicht ist, stattdessen z. B.:
    # image: ghcr.io/<github-name>/cartographer:1
    container_name: cartographer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Zeitzone der Handy-Kamera, falls Fotos keinen EXIF-Zeitzonen-Offset haben
      CAMERA_TZ: Europe/Zurich
      # Fotos ohne GPS über die Zeitstempel der GPX-Tracks verorten
      MATCH_PHOTOS_TO_TRACKS: "true"
      MATCH_MAX_GAP: "300"
    volumes:
      # Linke Seite: deine Syncthing-Ordner auf dem Server
      - /srv/syncthing/Karten-Album:/data/photos:ro
      - /srv/syncthing/GPX:/data/gpx:ro
    # Läuft standardmässig als "nobody" (65534). Falls die Dateien nicht lesbar
    # sind, UID:GID des Syncthing-Benutzers eintragen:
    # user: "1000:1000"
