services:
  gpx-cartographer:
    build: .
    # Once a release is published, use the prebuilt image instead.
    # ":0.1" gets all bug fixes from v0.1.x, but no new minor versions.
    # image: ghcr.io/noelr0/gpx-cartographer:0.1
    container_name: gpx-cartographer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Time zone of the phone camera, in case photos have no EXIF time zone offset
      CAMERA_TZ: Europe/Zurich
      # Locate photos without GPS using the timestamps of the GPX tracks
      MATCH_PHOTOS_TO_TRACKS: "true"
      MATCH_MAX_GAP: "300"
    volumes:
      # Left side: your directories on the host
      - /path/to/photos:/data/photos:ro
      - /path/to/gpx:/data/gpx:ro
    # Runs as "nobody" (65534) by default. If the files are not readable,
    # set the UID:GID of the Syncthing user:
    # user: "1000:1000"
