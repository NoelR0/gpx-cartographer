# Baut bei jedem Versions-Tag (z. B. v0.2.0) ein Docker-Image für amd64 und
# arm64 und veröffentlicht es unter ghcr.io/<owner>/gpx-cartographer.
#
#   git tag -a v0.2.0 -m "Beschreibung"
#   git push origin v0.2.0
#
# Erzeugte Image-Tags für v0.2.0: 0.2.0, 0.2, latest
#                    für v1.4.2: 1.4.2, 1.4, 1, latest

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image-Tags bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Kein Tag "0": unter v0.x darf sich laut Semver alles ändern
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Das Dockerfile kompiliert per GOARCH für die Zielplattform,
      # daher ist keine QEMU-Emulation nötig.
      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
