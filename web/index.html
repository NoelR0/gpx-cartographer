<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GPX Cartographer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
  <link rel="stylesheet" href="static/vendor/leaflet.css">
  <link rel="stylesheet" href="static/vendor/MarkerCluster.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div id="map"></div>

  <aside id="panel" class="panel">
    <header class="panel-head">
      <h1>GPX Cartographer</h1>
      <button id="reload" class="icon-btn" title="Rescan directories" aria-label="Reload">⟳</button>
      <button id="collapse" class="icon-btn" title="Collapse" aria-label="Toggle sidebar">‹</button>
    </header>
    <div class="panel-body">
      <div id="status" class="status">Loading…</div>
      <div class="toggles">
        <label><input type="checkbox" id="show-photos" checked> Photos <span id="count-photos" class="badge">0</span></label>
        <label><input type="checkbox" id="show-tracks" checked> Tracks <span id="count-tracks" class="badge">0</span></label>
      </div>
      <button id="fit-all" class="text-btn">Show all</button>
      <h2>Tracks</h2>
      <ul id="track-list" class="track-list"></ul>
    </div>
    <footer id="version" class="panel-foot"></footer>
  </aside>
  <button id="expand" class="panel-expand" title="Open sidebar" aria-label="Open sidebar">☰</button>

  <nav class="view-tabs" aria-label="View">
    <a href="#map" class="active">Map</a>
    <a href="#gallery">Photos</a>
    <a href="#stats">Statistics</a>
  </nav>

  <main id="gallery" class="stats-view" hidden>
    <div class="stats-inner">
      <div class="stats-head">
        <h1>Photos <span id="gallery-count" class="card-sub"></span></h1>
        <div id="gallery-filter" class="segmented" role="group" aria-label="Filter">
          <button data-filter="all">All</button>
          <button data-filter="located">On the map</button>
          <button data-filter="unlocated">Without position</button>
        </div>
      </div>
      <div id="gallery-content"></div>
    </div>
  </main>

  <main id="stats" class="stats-view" hidden>
    <div class="stats-inner">
      <div class="stats-head">
        <h1>Statistics</h1>
        <div id="stats-metric" class="segmented" role="group" aria-label="Measure">
          <button data-metric="distance">Distance</button>
          <button data-metric="time">Time</button>
          <button data-metric="ascent">Ascent</button>
          <button data-metric="count">Tracks</button>
        </div>
        <select id="stats-year" aria-label="Year"></select>
      </div>
      <div id="stats-content"></div>
    </div>
    <div id="stats-tip" class="stats-tip" hidden></div>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lb-top">
      <div class="lb-info">
        <div id="lb-title" class="lb-title"></div>
        <div id="lb-meta" class="lb-meta"></div>
      </div>
      <a id="lb-download" class="lb-btn" title="Download original" download>⤓</a>
      <button id="lb-locate" class="lb-btn" title="Show on map">⌖</button>
      <button id="lb-close" class="lb-btn" title="Close (Esc)">✕</button>
    </div>
    <div class="lb-stage">
      <button id="lb-prev" class="lb-nav prev" aria-label="Previous photo">‹</button>
      <img id="lb-img" alt="">
      <button id="lb-next" class="lb-nav next" aria-label="Next photo">›</button>
    </div>
    <div id="lb-strip" class="lb-strip"></div>
  </div>

  <script src="static/vendor/leaflet.js"></script>
  <script src="static/vendor/leaflet.markercluster.js"></script>
  <script src="static/stats.js"></script>
  <script src="static/gallery.js"></script>
  <script src="static/app.js"></script>
</body>
</html>
